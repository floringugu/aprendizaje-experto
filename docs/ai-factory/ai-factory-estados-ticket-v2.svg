<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1420" width="1920" height="1420" font-family="Helvetica, Arial, sans-serif">
<title>AI Factory para aprendizaje-experto: ciclo de vida del ticket (revisión 2)</title>
<desc>Diagrama de estados del ticket con una tabla de transiciones en la que toda salida de una sesión tiene destino.</desc>
<defs>
<marker id="ra" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M2 1.5 L10 6 L2 10.5" fill="none" stroke="#C8451B" stroke-width="1.3"/></marker>
<marker id="oa" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M2 1.5 L10 6 L2 10.5" fill="none" stroke="#111" stroke-width="1.3"/></marker>
<style>
.t{font-size:13px;fill:#111} .r{font-size:13px;fill:#1F5FA8} .g{font-size:13px;fill:#1E7A3C} .nm{font-size:15px;font-weight:bold;fill:#111} .n{font-size:13.5px;fill:#C8451B} .h1{font-size:24px;font-weight:bold;fill:#111} .h2{font-size:14px;fill:#444} .b{font-size:13px;font-weight:bold;fill:#111} .th{font-size:13px;font-weight:bold;fill:#111}
</style></defs>
<rect width="1920" height="1420" fill="#fff"/>
<text class="h1" x="50" y="48">AI Factory para aprendizaje-experto: ciclo de vida del ticket (revisión 2)</text>
<text class="h2" x="50" y="72">Cada número del dibujo es una fila de la tabla. La tabla es total: toda salida de una sesión tiene destino, y el destino por defecto es la cola. En azul, la revisión 2. En verde, la revisión 3: medición y mejora.</text>
<circle cx="30" cy="235" r="7" fill="#111"/>
<path d="M37 235 L58 235" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<path d="M280 235 L368 235" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<path d="M590 235 L678 235" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<path d="M900 235 L988 235" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<path d="M1210 235 L1298 235" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<path d="M1520 235 L1608 235" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<path d="M740 200 C740 115, 840 115, 840 198" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<path d="M1060 200 C1060 85, 880 85, 880 198" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<path d="M790 270 L790 418" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<path d="M1100 270 L1100 418" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<path d="M1410 270 L1410 418" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<path d="M1650 270 L1650 460 L1522 460" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<path d="M1760 270 L1760 558" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<path d="M680 460 L480 460 L480 272" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<path d="M1830 595 L1852 595" fill="none" stroke="#111" stroke-width="1.2"/>
<circle cx="1864" cy="595" r="11" fill="#fff" stroke="#111" stroke-width="1.2"/>
<circle cx="1864" cy="595" r="6" fill="#111"/>
<rect x="60" y="200" width="220" height="70" rx="14" fill="#fff" stroke="#111" stroke-width="1.3"/>
<text class="nm" x="170" y="230" text-anchor="middle">pendiente</text>
<text class="t" x="170" y="251" text-anchor="middle">creado, sin aprobar</text>
<rect x="370" y="200" width="220" height="70" rx="14" fill="#fff" stroke="#111" stroke-width="1.3"/>
<text class="nm" x="480" y="230" text-anchor="middle">listo</text>
<text class="t" x="480" y="251" text-anchor="middle">aprobado, espera carril</text>
<rect x="680" y="200" width="220" height="70" rx="14" fill="#fff" stroke="#111" stroke-width="1.3"/>
<text class="nm" x="790" y="230" text-anchor="middle">en carril</text>
<text class="t" x="790" y="251" text-anchor="middle">sesiones del Builder</text>
<rect x="990" y="200" width="220" height="70" rx="14" fill="#fff" stroke="#111" stroke-width="1.3"/>
<text class="nm" x="1100" y="230" text-anchor="middle">en revisión</text>
<text class="t" x="1100" y="251" text-anchor="middle">Aprobador, ronda 1 o 2</text>
<rect x="1300" y="200" width="220" height="70" rx="14" fill="#fff" stroke="#111" stroke-width="1.3"/>
<text class="nm" x="1410" y="230" text-anchor="middle">PR abierto</text>
<text class="t" x="1410" y="251" text-anchor="middle">Puerta de CI</text>
<rect x="1610" y="200" width="220" height="70" rx="14" fill="#fff" stroke="#111" stroke-width="1.3"/>
<text class="nm" x="1720" y="230" text-anchor="middle">en etapa/N</text>
<text class="t" x="1720" y="251" text-anchor="middle">integrado, sin revisar por ti</text>
<rect x="680" y="420" width="840" height="80" rx="14" fill="#FFF3D1" stroke="#111" stroke-width="1.3"/>
<text class="nm" x="1100" y="455" text-anchor="middle">cola de la mañana</text>
<text class="t" x="1100" y="476" text-anchor="middle">espera al Dueño: desde aquí nada avanza solo</text>
<rect x="1610" y="560" width="220" height="70" rx="14" fill="#fff" stroke="#111" stroke-width="1.3"/>
<text class="nm" x="1720" y="590" text-anchor="middle">hecho</text>
<text class="t" x="1720" y="611" text-anchor="middle">en main</text>
<circle cx="325" cy="235" r="13" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text class="b" x="325" y="239.5" text-anchor="middle">1</text>
<circle cx="635" cy="235" r="13" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text class="b" x="635" y="239.5" text-anchor="middle">2</text>
<circle cx="945" cy="235" r="13" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text class="b" x="945" y="239.5" text-anchor="middle">5</text>
<circle cx="1255" cy="235" r="13" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text class="b" x="1255" y="239.5" text-anchor="middle">7</text>
<circle cx="1565" cy="235" r="13" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text class="b" x="1565" y="239.5" text-anchor="middle">9</text>
<circle cx="790" cy="136" r="13" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text class="b" x="790" y="140.5" text-anchor="middle">3</text>
<circle cx="970" cy="114" r="13" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text class="b" x="970" y="118.5" text-anchor="middle">6</text>
<circle cx="790" cy="345" r="13" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text class="b" x="790" y="349.5" text-anchor="middle">4</text>
<circle cx="1100" cy="345" r="13" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text class="b" x="1100" y="349.5" text-anchor="middle">8</text>
<circle cx="1410" cy="345" r="13" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text class="b" x="1410" y="349.5" text-anchor="middle">10</text>
<circle cx="1650" cy="345" r="13" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text class="b" x="1650" y="349.5" text-anchor="middle">11</text>
<circle cx="1760" cy="415" r="13" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text class="b" x="1760" y="419.5" text-anchor="middle">12</text>
<circle cx="580" cy="460" r="13" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text class="b" x="580" y="464.5" text-anchor="middle">13</text>
<text class="n" x="505" y="104" text-anchor="start">relevo: red de seguridad,</text>
<text class="n" x="505" y="122" text-anchor="start">no el camino normal</text>
<path d="M668 112 C700 112, 740 118, 772 130" fill="none" stroke="#C8451B" stroke-width="1.2" marker-end="url(#ra)"/>
<text class="n" x="826" y="302" text-anchor="start">el revisor solo arranca</text>
<text class="n" x="826" y="320" text-anchor="start">con make check en verde</text>
<path d="M905 286 C915 274, 930 264, 938 251" fill="none" stroke="#C8451B" stroke-width="1.2" marker-end="url(#ra)"/>
<text class="n" x="1622" y="132" text-anchor="start">revisas por etapa; cada ticket</text>
<text class="n" x="1622" y="150" text-anchor="start">es un commit que se puede revertir</text>
<path d="M1656 156 C1656 172, 1662 180, 1662 197" fill="none" stroke="#C8451B" stroke-width="1.2" marker-end="url(#ra)"/>
<text class="n" x="700" y="548" text-anchor="start">todo lo que no tiene destino</text>
<text class="n" x="700" y="566" text-anchor="start">automático acaba aquí</text>
<path d="M690 548 C672 540, 690 520, 716 503" fill="none" stroke="#C8451B" stroke-width="1.2" marker-end="url(#ra)"/>
<rect x="40" y="660" width="1840" height="140" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="3 5"/>
<text class="nm" x="56" y="684">Bucle de mejora: fuera del ciclo del ticket, una vez por etapa</text>
<rect x="64" y="710" width="262" height="70" rx="14" fill="#DDF0DD" stroke="#111" stroke-width="1.3"/>
<text class="nm" x="195" y="740" text-anchor="middle">fichas de la etapa</text>
<text class="t" x="195" y="761" text-anchor="middle">una por ticket, con versionFabrica</text>
<path d="M326 745 L364 745" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<rect x="366" y="710" width="262" height="70" rx="14" fill="#DDF0DD" stroke="#111" stroke-width="1.3"/>
<text class="nm" x="497" y="740" text-anchor="middle">Mejorador</text>
<text class="t" x="497" y="761" text-anchor="middle">agrupa fallos repetidos</text>
<path d="M628 745 L666 745" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<rect x="668" y="710" width="262" height="70" rx="14" fill="#DDF0DD" stroke="#111" stroke-width="1.3"/>
<text class="nm" x="799" y="740" text-anchor="middle">PR a la definición</text>
<text class="t" x="799" y="761" text-anchor="middle">nunca toca la Puerta de CI</text>
<path d="M930 745 L968 745" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<rect x="970" y="710" width="262" height="70" rx="14" fill="#DDF0DD" stroke="#111" stroke-width="1.3"/>
<text class="nm" x="1101" y="740" text-anchor="middle">Banco de repetición</text>
<text class="t" x="1101" y="761" text-anchor="middle">si hay duda: variante frente a actual</text>
<path d="M1232 745 L1270 745" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<rect x="1272" y="710" width="262" height="70" rx="14" fill="#fff" stroke="#111" stroke-width="1.3"/>
<text class="nm" x="1403" y="740" text-anchor="middle">tú apruebas</text>
<text class="t" x="1403" y="761" text-anchor="middle">o descartas el PR</text>
<path d="M1534 745 L1572 745" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#oa)"/>
<rect x="1574" y="710" width="262" height="70" rx="14" fill="#DDF0DD" stroke="#111" stroke-width="1.3"/>
<text class="nm" x="1705" y="740" text-anchor="middle">versionFabrica nueva</text>
<text class="t" x="1705" y="761" text-anchor="middle">rige los tickets siguientes</text>
<rect x="40" y="830" width="1840" height="565" fill="#fff" stroke="#111" stroke-width="1"/>
<text class="nm" x="56" y="856">Tabla de transiciones</text>
<text class="th" x="60" y="886">Nº</text>
<text class="th" x="120" y="886">De → a</text>
<text class="th" x="400" y="886">Disparador</text>
<text class="th" x="800" y="886">Condición</text>
<text class="th" x="1250" y="886">Efecto</text>
<line x1="56" y1="895" x2="1864" y2="895" stroke="#111" stroke-width="1.2"/>
<text class="t" x="60" y="918">1</text>
<text class="t" x="120" y="918">pendiente → listo</text>
<text class="t" x="400" y="918">el Dueño aprueba el ticket</text>
<text class="t" x="800" y="918">dependencias en hecho</text>
<text class="t" x="1250" y="918">queda disponible para el Despachador</text>
<line x1="56" y1="926" x2="1864" y2="926" stroke="#ddd" stroke-width="1"/>
<text class="r" x="60" y="943">2</text>
<text class="r" x="120" y="943">listo → en carril</text>
<text class="r" x="400" y="943">el Despachador abre carril</text>
<text class="r" x="800" y="943">carriles &lt; 3 y «toca» sin solape con carriles activos</text>
<text class="r" x="1250" y="943">worktree y rama nuevos; si no se cumple, sigue en listo</text>
<line x1="56" y1="951" x2="1864" y2="951" stroke="#ddd" stroke-width="1"/>
<text class="t" x="60" y="968">3</text>
<text class="t" x="120" y="968">en carril → en carril</text>
<text class="t" x="400" y="968">la sesión acaba en [RELEVO]</text>
<text class="t" x="800" y="968">relevos &lt; 4</text>
<text class="t" x="1250" y="968">sesión nueva: lee el relevo y lo archiva</text>
<line x1="56" y1="976" x2="1864" y2="976" stroke="#ddd" stroke-width="1"/>
<text class="r" x="60" y="993">4a</text>
<text class="r" x="120" y="993">en carril → cola</text>
<text class="r" x="400" y="993">la sesión acaba en [RELEVO]</text>
<text class="r" x="800" y="993">relevos = 4</text>
<text class="r" x="1250" y="993">ticket demasiado grande: hay que trocearlo</text>
<line x1="56" y1="1001" x2="1864" y2="1001" stroke="#ddd" stroke-width="1"/>
<text class="t" x="60" y="1018">4b</text>
<text class="t" x="120" y="1018">en carril → cola</text>
<text class="t" x="400" y="1018">la sesión acaba en [DECISIÓN]</text>
<text class="t" x="800" y="1018">—</text>
<text class="t" x="1250" y="1018">espera tu respuesta</text>
<line x1="56" y1="1026" x2="1864" y2="1026" stroke="#ddd" stroke-width="1"/>
<text class="t" x="60" y="1043">4c</text>
<text class="t" x="120" y="1043">en carril → cola</text>
<text class="t" x="400" y="1043">la sesión acaba con-cambios</text>
<text class="t" x="800" y="1043">cambios sin commit</text>
<text class="t" x="1250" y="1043">el worktree se conserva tal cual</text>
<line x1="56" y1="1051" x2="1864" y2="1051" stroke="#ddd" stroke-width="1"/>
<text class="r" x="60" y="1068">4d</text>
<text class="r" x="120" y="1068">en carril → cola</text>
<text class="r" x="400" y="1068">la sesión acaba sin-cambios</text>
<text class="r" x="800" y="1068">sin PR y make check en rojo</text>
<text class="r" x="1250" y="1068">el Builder paró sin avisar</text>
<line x1="56" y1="1076" x2="1864" y2="1076" stroke="#ddd" stroke-width="1"/>
<text class="r" x="60" y="1093">4e</text>
<text class="r" x="120" y="1093">en carril → cola</text>
<text class="r" x="400" y="1093">vence timeoutSesion</text>
<text class="r" x="800" y="1093">sin entrada en el registro de paradas</text>
<text class="r" x="1250" y="1093">sesión muerta</text>
<line x1="56" y1="1101" x2="1864" y2="1101" stroke="#ddd" stroke-width="1"/>
<text class="r" x="60" y="1118">4f</text>
<text class="r" x="120" y="1118">en carril → cola</text>
<text class="r" x="400" y="1118">cualquier otro resultado</text>
<text class="r" x="800" y="1118">—</text>
<text class="r" x="1250" y="1118">regla por defecto: nada queda colgado</text>
<line x1="56" y1="1126" x2="1864" y2="1126" stroke="#ddd" stroke-width="1"/>
<text class="r" x="60" y="1143">5</text>
<text class="r" x="120" y="1143">en carril → en revisión</text>
<text class="r" x="400" y="1143">la sesión acaba sin-cambios</text>
<text class="r" x="800" y="1143">sin PR y make check en verde</text>
<text class="r" x="1250" y="1143">el Aprobador arranca en sesión propia</text>
<line x1="56" y1="1151" x2="1864" y2="1151" stroke="#ddd" stroke-width="1"/>
<text class="t" x="60" y="1168">6</text>
<text class="t" x="120" y="1168">en revisión → en carril</text>
<text class="t" x="400" y="1168">hay hallazgos</text>
<text class="t" x="800" y="1168">ronda &lt; 2</text>
<text class="t" x="1250" y="1168">el Builder corrige y vuelve a pasar make check</text>
<line x1="56" y1="1176" x2="1864" y2="1176" stroke="#ddd" stroke-width="1"/>
<text class="r" x="60" y="1193">7</text>
<text class="r" x="120" y="1193">en revisión → PR abierto</text>
<text class="r" x="400" y="1193">no quedan hallazgos bloqueantes</text>
<text class="r" x="800" y="1193">sin hallazgos, o ronda = 2</text>
<text class="r" x="1250" y="1193">abre PR; los menores van al informe (pasarResto)</text>
<line x1="56" y1="1201" x2="1864" y2="1201" stroke="#ddd" stroke-width="1"/>
<text class="r" x="60" y="1218">8</text>
<text class="r" x="120" y="1218">en revisión → cola</text>
<text class="r" x="400" y="1218">queda algún hallazgo bloqueante</text>
<text class="r" x="800" y="1218">ronda = 2</text>
<text class="r" x="1250" y="1218">no se abre PR</text>
<line x1="56" y1="1226" x2="1864" y2="1226" stroke="#ddd" stroke-width="1"/>
<text class="r" x="60" y="1243">9</text>
<text class="r" x="120" y="1243">PR abierto → en etapa/N</text>
<text class="r" x="400" y="1243">Puerta de CI en verde</text>
<text class="r" x="800" y="1243">rutas ⊆ fase ∩ ticket.toca; make check; mutación</text>
<text class="r" x="1250" y="1243">squash: un commit por ticket</text>
<line x1="56" y1="1251" x2="1864" y2="1251" stroke="#ddd" stroke-width="1"/>
<text class="t" x="60" y="1268">10</text>
<text class="t" x="120" y="1268">PR abierto → cola</text>
<text class="t" x="400" y="1268">Puerta de CI en rojo</text>
<text class="t" x="800" y="1268">—</text>
<text class="t" x="1250" y="1268">el PR queda abierto</text>
<line x1="56" y1="1276" x2="1864" y2="1276" stroke="#ddd" stroke-width="1"/>
<text class="r" x="60" y="1293">11</text>
<text class="r" x="120" y="1293">en etapa/N → cola</text>
<text class="r" x="400" y="1293">CI de etapa/N en rojo tras una fusión</text>
<text class="r" x="800" y="1293">—</text>
<text class="r" x="1250" y="1293">candidato a revertir: el último commit fusionado</text>
<line x1="56" y1="1301" x2="1864" y2="1301" stroke="#ddd" stroke-width="1"/>
<text class="t" x="60" y="1318">12</text>
<text class="t" x="120" y="1318">en etapa/N → hecho</text>
<text class="t" x="400" y="1318">revisas el informe de etapa</text>
<text class="t" x="800" y="1318">CI de etapa/N en verde</text>
<text class="t" x="1250" y="1318">rebase de etapa/N a main; tu veredicto va a la ficha</text>
<line x1="56" y1="1326" x2="1864" y2="1326" stroke="#ddd" stroke-width="1"/>
<text class="t" x="60" y="1343">13</text>
<text class="t" x="120" y="1343">cola → listo</text>
<text class="t" x="400" y="1343">resuelves la entrada de la cola</text>
<text class="t" x="800" y="1343">—</text>
<text class="t" x="1250" y="1343">el ticket se vuelve a despachar</text>
<line x1="56" y1="1351" x2="1864" y2="1351" stroke="#ddd" stroke-width="1"/>
<text class="g" x="60" y="1368">∗</text>
<text class="g" x="120" y="1368">toda transición</text>
<text class="g" x="400" y="1368">el Despachador la ejecuta</text>
<text class="g" x="800" y="1368">—</text>
<text class="g" x="1250" y="1368">añade una línea a la ficha del ticket, con la versionFabrica vigente</text>
</svg>